<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>アルファベット大文字かるた | 小学校外国語アプリポータル</title>
<meta name="description" content="3年生外国語活動 アルファベット大文字を音で聞いてタップする「かるた」アプリ。ひとりれんしゅう・でんしこくばんチーム戦・もじさがしの3モード。">

<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800&family=Fredoka+One&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../shared/app-ui.css">

<style>
/* ============================================================
   このアプリ固有のスタイル(共通部品は ../shared/app-ui.css)
   クラス接頭辞は k-
   ============================================================ */
html,body{ height:100%; }
body{
  display:flex; flex-direction:column; min-height:100vh; margin:0;
  background:var(--bg);
  background-image:radial-gradient(#ffffff 20%,transparent 20%),radial-gradient(#ffffff 20%,transparent 20%);
  background-position:0 0,20px 20px; background-size:40px 40px;
  -webkit-user-select:none; user-select:none; touch-action:manipulation;
}
main{
  flex:1 1 auto; min-height:0; display:flex; flex-direction:column;
  width:100%; max-width:1600px; margin:0 auto; padding:10px 16px 14px; box-sizing:border-box;
}

/* app-ui.css が定義していない絵文字フォールバックの見た目(cardImg用) */
.app-card-emoji{ display:flex; align-items:center; justify-content:center; width:100%; height:100%; line-height:1; }

/* ---------- モードせんたく ---------- */
.k-title{ text-align:center; margin:12px 0 4px; font-size:clamp(1.15rem,3vw,1.4rem); font-weight:800; }
.k-sub{ text-align:center; color:var(--sub); font-weight:700; font-size:.85rem; margin-bottom:4px; line-height:1.7; }
.k-range-row{ display:flex; gap:10px; justify-content:center; margin-top:20px; flex-wrap:wrap; align-items:center; }
.k-range-lbl{ font-weight:800; color:var(--sub); font-size:.9rem; }
.k-range-btn{
  border:3px solid #e6ecf2; background:#fff; border-radius:50px; padding:10px 22px; font-family:inherit;
  font-weight:800; font-size:.95rem; cursor:pointer; min-height:48px; color:var(--sub); transition:.2s;
}
.k-range-btn:hover{ transform:translateY(-2px); border-color:var(--primary); }
.k-range-btn.on{ background:var(--primary); border-color:var(--primary); color:#fff; }
.k-best-badge{ display:block; text-align:center; margin:18px auto 0; width:fit-content; font-size:.85rem; padding:9px 22px; }

/* ---------- 画面いっぱいのかるた盤面(ひとり/でんしこくばん/もじさがし共通) ---------- */
.k-screen{ flex:1 1 auto; min-height:0; display:flex; flex-direction:column; }
.k-call-bar{ display:flex; align-items:center; justify-content:center; gap:14px; margin:4px 0 10px; flex-wrap:wrap; }
.k-call-word{
  font-family:var(--app-font-display); font-size:clamp(1.15rem,2.8vw,1.7rem); color:var(--primary);
  background:#fff; padding:10px 26px; border-radius:50px; box-shadow:var(--shadow); font-weight:400;
}

/* でんしこくばん スコアバー */
.k-scorebar{ display:flex; align-items:center; gap:10px; margin:0 0 10px; flex-wrap:wrap; }
.k-steam{ font-weight:800; padding:8px 18px; border-radius:50px; color:#fff; min-width:88px; text-align:center; box-shadow:var(--shadow); font-size:.95rem; }
.k-steam.red{ background:linear-gradient(135deg,#ff8787,#ff4757); }
.k-steam.white{ background:linear-gradient(135deg,#eef3f8,#c2ccd6); color:#2d3436; }
.k-strack{ flex:1 1 160px; height:20px; background:#eef2f6; border-radius:50px; overflow:hidden; display:flex; box-shadow:inset 0 2px 5px rgba(0,0,0,.08); }
.k-sfill-red{ background:linear-gradient(90deg,#ff8787,#ff4757); transition:width .4s ease; }
.k-sfill-white{ background:linear-gradient(90deg,#eef3f8,#c2ccd6); transition:width .4s ease; }
.k-chip-red{ background:linear-gradient(135deg,#ff8787,#ff4757); color:#fff; }
.k-chip-white{ background:linear-gradient(135deg,#eef3f8,#c2ccd6); color:#2d3436; }

.k-board-wrap{ flex:1 1 auto; min-height:0; display:flex; }
.k-board{
  flex:1 1 auto; width:100%; display:grid;
  grid-template-columns:repeat(var(--cols,7),1fr);
  grid-template-rows:repeat(var(--rows,4),1fr);
  gap:clamp(6px,1.3vw,16px);
}
.k-tile{
  container-type:size;
  position:relative; background:#fff; border-radius:18px; border:4px solid #ffeacc; box-shadow:var(--shadow);
  display:flex; align-items:center; justify-content:center; overflow:hidden;
  font-family:inherit; color:var(--ink); cursor:pointer;
  min-height:var(--app-touch); min-width:var(--app-touch);
  transition:transform .15s ease, box-shadow .15s ease, border-color .15s ease, background .2s ease;
}
.k-tile:hover{ transform:translateY(-3px); box-shadow:var(--shadow-hover); border-color:var(--primary); }
.k-tile:active{ transform:translateY(0) scale(.96); }
.k-tile-letter{
  font-family:var(--app-font-display); line-height:1; font-weight:400;
  font-size:clamp(1.6rem,8vmin,5.5rem);
  font-size:min(48cqw,58cqh);
}
.k-tile.k-taken{ pointer-events:none; }
.k-tile.k-taken:not(.team-red):not(.team-white){ opacity:.16; transform:scale(.82); border-color:#e6ecf2; }
.k-tile.k-taken.team-red{ background:linear-gradient(135deg,#ff8787,#ff4757); border-color:#ff4757; color:#fff; opacity:1; }
.k-tile.k-taken.team-white{ background:linear-gradient(135deg,#f4f7fa,#dbe2e9); border-color:#b2bec3; color:#2d3436; opacity:1; }

@keyframes k-fly{
  0%{ transform:scale(1) rotate(0) translateY(0); opacity:1; }
  35%{ transform:scale(1.32) rotate(-9deg) translateY(-8px); opacity:1; }
  70%{ transform:scale(1.15) rotate(16deg) translateY(-46px); opacity:1; }
  100%{ transform:scale(.5) rotate(30deg) translateY(-100px); opacity:0; }
}
.k-tile.k-correct-fly{
  animation:k-fly .68s cubic-bezier(.34,1.4,.64,1) forwards;
  z-index:6; border-color:var(--green); box-shadow:0 18px 30px rgba(0,0,0,.25); pointer-events:none;
}

/* ---------- もじさがし ---------- */
.k-search-top{ flex:0 0 auto; padding:6px 0 4px; }
.k-search-visual{
  width:min(44vmin,240px); height:min(44vmin,240px); margin:0 auto 8px;
  background:#fff; border-radius:28px; box-shadow:var(--shadow-hover); border:6px solid #fff;
  display:flex; align-items:center; justify-content:center; overflow:hidden;
}
.k-search-visual img{ width:100%; height:100%; object-fit:contain; }
.k-search-visual .app-card-emoji{ font-size:6.5rem; }
.k-search-word{
  text-align:center; font-family:var(--app-font-display); font-weight:400;
  font-size:clamp(1.15rem,3.2vw,1.6rem); color:var(--purple); margin-bottom:8px;
}

/* ---------- けっか ---------- */
.k-result-box{ max-width:520px; margin:24px auto; background:#fff; border-radius:28px; box-shadow:var(--shadow-hover); padding:30px 26px; text-align:center; border:5px solid var(--primary); }
.k-result-emoji{ font-size:4.4rem; animation:app-pop .5s; }
.k-result-title{ font-size:1.35rem; font-weight:800; margin-top:6px; }
.k-stat-list{ margin-top:16px; text-align:left; display:flex; flex-direction:column; gap:8px; }
.k-stat-row{ display:flex; justify-content:space-between; align-items:center; gap:10px; font-weight:800; padding:9px 16px; border-radius:12px; background:#fff8ec; }
.k-stat-row .k-stat-val{ font-family:var(--app-font-display); color:var(--primary); font-weight:400; }

footer{ text-align:center; padding:14px; color:#b2bec3; font-size:.72rem; font-weight:700; flex:0 0 auto; }

@media (max-width:560px){
  .k-tile-letter{ font-size:clamp(1.3rem,7vmin,3.4rem); font-size:min(44cqw,54cqh); }
  /* せまい画面では 札の 最小はば(72px)を 守ると 26まいの ばんが 画面から はみ出す。
     はみ出して 横に スクロールするより、札を 少し 小さくして 全部 見えるほうが
     かるたとして 成立するので、ここだけ ゆるめる(高さは 指で 押せる 大きさを 残す)。 */
  .k-tile{ min-width:0; min-height:56px; }
}
</style>

<script src="../shared/app-ui.js"></script>
<script>
(function(){
'use strict';

/* ============================================================
   0. 小さなヘルパー(AppUI が無くても落ちないように)
   ============================================================ */
var $ = function(id){ return document.getElementById(id); };
function sfx(name, arg){ try{ if(window.AppUI && AppUI.sfx && AppUI.sfx[name]) AppUI.sfx[name](arg); }catch(e){} }
function say(text){ try{ if(window.AppUI && AppUI.speak) AppUI.speak(text); }catch(e){} }
function starsAt(x,y,opts){ try{ if(window.AppUI && AppUI.stars) AppUI.stars(x,y,opts); }catch(e){} }
function celebrate(opts){ try{ if(window.AppUI && AppUI.celebrate) return AppUI.celebrate(opts); }catch(e){} }
function shuffleArr(a){
  if(window.AppUI && AppUI.shuffle) return AppUI.shuffle(a);
  var b = a.slice();
  for(var i=b.length-1;i>0;i--){ var j = Math.floor(Math.random()*(i+1)); var t=b[i]; b[i]=b[j]; b[j]=t; }
  return b;
}
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

/* コンボが上がるほど 音の高さが 上がっていく「ミニ効果音」
   (AppUI.sfx にはピッチ指定つきの音が無いため、ここだけ 補助として
   独自の WebAudio 発振音を追加しています。詳細はレポート参照) */
var comboCtx = null;
function getComboCtx(){
  if(!comboCtx){
    try{ comboCtx = new (window.AudioContext || window.webkitAudioContext)(); }
    catch(e){ comboCtx = null; }
  }
  return comboCtx;
}
['pointerdown','touchstart','keydown'].forEach(function(evt){
  try{
    document.addEventListener(evt, function(){
      var c = getComboCtx();
      if(c && c.state === 'suspended'){ c.resume().catch(function(){}); }
    }, { passive:true });
  }catch(e){}
});
function comboBeep(combo){
  var c = getComboCtx(); if(!c) return;
  try{
    var freq = 620 + Math.min(combo, 16) * 38;
    var t0 = c.currentTime;
    var osc = c.createOscillator(), gain = c.createGain();
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(freq, t0);
    gain.gain.setValueAtTime(0.0001, t0);
    gain.gain.exponentialRampToValueAtTime(0.16, t0 + 0.02);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.22);
    osc.connect(gain).connect(c.destination);
    osc.start(t0); osc.stop(t0 + 0.26);
  }catch(e){}
}

/* ============================================================
   1. データ(先生向け:ここを書きかえると内容を変更できます)
   もじさがし用のことば(word の頭文字が正解になります)。
   img は Picture Dictionary の画像ファイル名(無ければ絵文字で表示)。
   ============================================================ */
var SEARCH_WORDS = [
  { word:"Apple",     emoji:"🍎", img:"apple.jpg" },
  { word:"Banana",    emoji:"🍌", img:"banana.jpg" },
  { word:"Cat",       emoji:"🐱", img:"cat.jpg" },
  { word:"Dog",       emoji:"🐶", img:"dog.jpg" },
  { word:"Elephant",  emoji:"🐘", img:"elephant.jpg" },
  { word:"Fish",      emoji:"🐟", img:"fish.jpg" },
  { word:"Gorilla",   emoji:"🦍", img:"gorilla.jpg" },
  { word:"Hat",       emoji:"🎩", img:"hat.jpg" },
  { word:"Ice cream", emoji:"🍦", img:"ice cream.jpg" },
  { word:"Jet",       emoji:"✈️", img:"jet.jpg" },
  { word:"King",      emoji:"👑", img:"king.jpg" },
  { word:"Lion",      emoji:"🦁", img:"lion.jpg" },
  { word:"Monkey",    emoji:"🐵", img:"monkey.jpg" },
  { word:"Notebook",  emoji:"📓", img:"notebook.jpg" },
  { word:"Orange",    emoji:"🍊", img:"orange_fruit.jpg" },
  { word:"Pig",       emoji:"🐷", img:"pig.jpg" },
  { word:"Queen",     emoji:"👸", img:"queen.jpg" },
  { word:"Rabbit",    emoji:"🐰", img:"rabbit.jpg" },
  { word:"Sun",       emoji:"☀️", img:"sun.jpg" },
  { word:"Tiger",     emoji:"🐯", img:"tiger.jpg" },
  { word:"Umbrella",  emoji:"☔", img:"umbrella.jpg" },
  { word:"Violin",    emoji:"🎻", img:"violin.jpg" },
  { word:"Watch",     emoji:"⌚", img:"watch_item.jpg" },
  { word:"Xylophone", emoji:"🎹", img:"xylophone.jpg" },
  { word:"Yo-yo",     emoji:"🪀", img:"yo-yo.jpg" },
  { word:"Zebra",     emoji:"🦓", img:"zebra.jpg" }
];
var SEARCH_COUNT = 8; // もじさがしの問題数

/* ============================================================
   2. 状態
   ============================================================ */
var ALL = "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("");
var range = "all";
var mode = null;               // 'personal' | 'board' | 'search'
var curScreen = "mode";

var letters = [], order = [], orderIdx = 0, target = null, callAt = 0;
var times = [];                 // {letter, ms}(ひとりモード)
var combo = 0, comboBest = 0;   // ひとりモード
var startedAt = 0;
var liveTimer = null;

var teamScore = { red:0, white:0 }; // でんしこくばんモード
var turnTeam = "red";
var cardTeamMap = {};

var sQuiz = [], sIdx = 0, sScore = 0, sAnswered = false; // もじさがし

function rangeLetters(){
  if(range === "first") return ALL.slice(0,13);
  if(range === "second") return ALL.slice(13);
  return ALL.slice();
}
function rangeLabel(r){
  if(r === "first") return "A〜M";
  if(r === "second") return "N〜Z";
  return "A〜Z";
}

/* ============================================================
   3. 画面の大きさに あわせて 盤面のマス目を できるだけ 大きくする
   (列数を 1〜n で ぜんぶ試して、いちばん大きな正方形に近いマスに
    なる列数を えらぶ)
   ============================================================ */
function fitGrid(container, n){
  if(!container || n <= 0) return { cols:1, rows:1 };
  var rect = container.getBoundingClientRect();
  var w = Math.max(rect.width, 120);
  var h = Math.max(rect.height, 120);
  var bestCols = 1, bestSize = -1;
  for(var cols=1; cols<=n; cols++){
    var rows = Math.ceil(n/cols);
    var cellW = w/cols, cellH = h/rows;
    var size = Math.min(cellW, cellH);
    if(size > bestSize){ bestSize = size; bestCols = cols; }
  }
  return { cols:bestCols, rows:Math.ceil(n/bestCols) };
}
function applyFitGrid(wrapEl, n){
  if(!wrapEl) return;
  var f = fitGrid(wrapEl, n);
  wrapEl.style.setProperty('--cols', f.cols);
  wrapEl.style.setProperty('--rows', f.rows);
}
window.addEventListener('resize', function(){
  if(curScreen === 'board') applyFitGrid($('board-wrap'), letters.length);
  else if(curScreen === 'search') applyFitGrid($('board2-wrap'), letters.length);
});

/* ============================================================
   4. 画面の切りかえ
   ============================================================ */
var SCREENS = ["scr-mode","scr-board","scr-search","scr-result"];
function show(id){
  SCREENS.forEach(function(s){ $(s).classList.toggle("app-hidden", s !== id); });
  curScreen = id.replace("scr-","");
}

/* ============================================================
   5. 自己ベスト表示(モードせんたく画面)
   ============================================================ */
function bestStore(){ return AppUI.store('g3u6alpha-best-' + range); }
function updateBestBadge(){
  var el = $('best-badge');
  try{
    var best = bestStore().get(null);
    if(best && typeof best.ms === 'number'){
      el.textContent = '🏆 じこベスト(' + rangeLabel(range) + '): ' + (best.ms/1000).toFixed(1) + 'びょう';
      el.classList.remove('app-hidden');
    }else{
      el.textContent = '';
      el.classList.add('app-hidden');
    }
  }catch(e){ el.classList.add('app-hidden'); }
}
document.querySelectorAll('.k-range-btn').forEach(function(b){
  b.addEventListener('click', function(){
    document.querySelectorAll('.k-range-btn').forEach(function(x){ x.classList.remove('on'); });
    b.classList.add('on');
    range = b.dataset.r;
    sfx('tap');
    updateBestBadge();
  });
});

/* ============================================================
   6. かるた盤面の組み立て(ひとり/でんしこくばん)
   ============================================================ */
function tileHtml(L){
  /* data-say = 「おしたら 読み上げが おきる」しるし(かるたの よみあげは ゲームの中心)。 */
  return '<button type="button" class="k-tile" data-say="' + L + '" data-l="' + L + '" aria-label="' + L + '">' +
         '<span class="k-tile-letter">' + L + '</span></button>';
}
function buildBoard(){
  $('board').innerHTML = letters.map(tileHtml).join('');
  applyFitGrid($('board-wrap'), letters.length);
}
function configureBoardHud(){
  var isTeam = (mode === 'board');
  $('hud-combo').classList.toggle('app-hidden', isTeam);
  $('hud-time').classList.toggle('app-hidden', isTeam);
  $('hud-team-turn').classList.toggle('app-hidden', !isTeam);
  $('scorebar').classList.toggle('app-hidden', !isTeam);
}
function startKaruta(m){
  mode = m;
  letters = shuffleArr(rangeLetters());
  order = shuffleArr(letters.slice());
  orderIdx = 0; target = null;
  times = []; combo = 0; comboBest = 0;
  teamScore = { red:0, white:0 }; turnTeam = 'red'; cardTeamMap = {};

  show('scr-board');
  configureBoardHud();
  buildBoard();
  updateHud();
  startedAt = Date.now();
  if(mode === 'personal') startLiveTimer(); else stopLiveTimer();
  setTimeout(callNext, 700);
}
function callNext(){
  if(orderIdx >= order.length){ finishKaruta(); return; }
  target = order[orderIdx];
  callAt = Date.now();
  $('hud-call').textContent = '🔊 よく きいてね…';
  updateHud();
  say(target); // ← かるたの「よみあげ」機能(出題)。ゲーム成立に必要なため許容。
}
function updateHud(){
  var remaining = order.length - orderIdx;
  $('hud-left').textContent = 'のこり ' + remaining + 'まい';
  if(mode === 'personal'){
    $('hud-combo').textContent = '🔥 コンボ ' + combo;
  }else if(mode === 'board'){
    var chip = $('hud-team-turn');
    chip.textContent = (turnTeam === 'red' ? '🔴 あか' : '⚪ しろ') + 'チームの ばん';
    chip.classList.toggle('k-chip-red', turnTeam === 'red');
    chip.classList.toggle('k-chip-white', turnTeam === 'white');
    updateScorebar();
  }
}
function updateScorebar(){
  var r = teamScore.red, w = teamScore.white, total = r + w;
  var rp = total ? (r/total*100) : 50;
  $('score-red').textContent = r;
  $('score-white').textContent = w;
  $('score-fill-red').style.width = rp + '%';
  $('score-fill-white').style.width = (100-rp) + '%';
}
function startLiveTimer(){
  stopLiveTimer();
  liveTimer = setInterval(function(){
    var el = $('hud-time'); if(!el) return;
    el.textContent = '⏱️ ' + ((Date.now()-startedAt)/1000).toFixed(1) + 'びょう';
  }, 100);
}
function stopLiveTimer(){ if(liveTimer){ clearInterval(liveTimer); liveTimer = null; } }

$('btn-repeat').addEventListener('click', function(){ sfx('tap'); if(target) say(target); });

$('board').addEventListener('click', function(e){
  var el = e.target.closest('.k-tile');
  if(!el || !target || el.classList.contains('k-taken')) return;
  if(el.dataset.l === target) handleCorrectPick(el);
  else handleWrongPick(el);
});

function handleWrongPick(el){
  el.classList.remove('app-anim-shake'); void el.offsetWidth; el.classList.add('app-anim-shake');
  setTimeout(function(){ el.classList.remove('app-anim-shake'); }, 460);
  sfx('wrong');
  if(mode === 'personal'){ combo = 0; updateHud(); }
}
function handleCorrectPick(el){
  var letter = target;
  var ms = Date.now() - callAt;
  target = null; // 次の判定が来るまで タップを むこうにする

  var rect = el.getBoundingClientRect();
  el.classList.remove('app-anim-shake');
  el.classList.add('k-correct-fly');
  sfx('correct');

  var pickedTeam = turnTeam;
  if(mode === 'personal'){
    times.push({ letter:letter, ms:ms });
    combo++; comboBest = Math.max(comboBest, combo);
    comboBeep(combo);
    if(combo > 0 && combo % 5 === 0) sfx('pop');
    starsAt(rect.left + rect.width/2, rect.top + rect.height/2, { count: Math.min(8 + combo, 20) });
    updateHud();
  }else if(mode === 'board'){
    teamScore[pickedTeam]++;
    cardTeamMap[letter] = pickedTeam;
    starsAt(rect.left + rect.width/2, rect.top + rect.height/2, { count:10 });
    updateScorebar();
  }
  $('hud-call').textContent = '⭕ ' + letter + '!';

  setTimeout(function(){
    el.classList.remove('k-correct-fly');
    el.classList.add('k-taken');
    if(mode === 'board') el.classList.add('team-' + cardTeamMap[letter]);
    orderIdx++;
    if(mode === 'board') turnTeam = (turnTeam === 'red') ? 'white' : 'red';
    callNext();
  }, 680);
}

/* ============================================================
   7. けっか(ひとり/でんしこくばん)
   ============================================================ */
function finishKaruta(){
  stopLiveTimer();
  target = null;
  if(mode === 'personal') finishPersonal(); else finishBoard();
}
function finishPersonal(){
  var totalMs = Date.now() - startedAt;
  var avgMs = times.length ? times.reduce(function(s,t){ return s+t.ms; }, 0) / times.length : 0;
  var store = bestStore();
  var prevBest = store.get(null);
  var isRecord = !prevBest || totalMs < prevBest.ms;
  if(isRecord) store.set({ ms: totalMs, comboBest: comboBest, at: Date.now() });
  var bestMs = isRecord ? totalMs : prevBest.ms;

  showResult({
    icon: isRecord ? '🏆' : '🎉',
    title: isRecord ? 'じこベスト こうしん!' : 'ぜんぶ とれたね!',
    stats: [
      { label:'かかった じかん', value:(totalMs/1000).toFixed(1)+'びょう' },
      { label:'へいきん(1文字)', value:(avgMs/1000).toFixed(1)+'びょう' },
      { label:'さいこう コンボ', value:comboBest+'かい' },
      { label:'じこベスト('+rangeLabel(range)+')', value:(bestMs/1000).toFixed(1)+'びょう' }
    ]
  });
  celebrate({
    icon: isRecord ? '🏆' : '🎉',
    title: isRecord ? '🏆 じこベスト こうしん!' : 'クリア!',
    sub: (totalMs/1000).toFixed(1) + 'びょうで ぜんぶ とれたよ',
    autoHideMs: 1800
  });
}
function finishBoard(){
  showResult({ icon:'🥁', title:'しゅうけいちゅう…', stats:[] });
  sfx('drumroll', 1400);
  setTimeout(function(){
    var r = teamScore.red, w = teamScore.white;
    var winner = (r === w) ? 'draw' : (r > w ? 'red' : 'white');
    var title = winner === 'draw' ? '🤝 ひきわけ!' : (winner === 'red' ? '🔴 あかチームの かち!' : '⚪ しろチームの かち!');
    showResult({
      icon: winner === 'draw' ? '🤝' : '🏆',
      title: title,
      stats: [
        { label:'🔴 あかチーム', value:r+'まい' },
        { label:'⚪ しろチーム', value:w+'まい' }
      ]
    });
    celebrate({
      icon: winner === 'draw' ? '🤝' : '🏆',
      title: title,
      sub: 'あか ' + r + 'まい ・ しろ ' + w + 'まい',
      autoHideMs: 2400
    });
  }, 1500);
}
function showResult(opts){
  $('res-emoji').textContent = opts.icon || '🏆';
  $('res-title').textContent = opts.title || '';
  var wrap = $('res-stats');
  wrap.innerHTML = (opts.stats || []).map(function(s){
    return '<div class="k-stat-row"><span>' + esc(s.label) + '</span><span class="k-stat-val">' + esc(s.value) + '</span></div>';
  }).join('');
  show('scr-result');
}

/* ============================================================
   8. もじさがし
   ============================================================ */
function buildBoard2(){
  $('board2').innerHTML = letters.map(tileHtml).join('');
  applyFitGrid($('board2-wrap'), letters.length);
}
function startSearch(){
  mode = 'search';
  var allowed = rangeLetters();
  var pool = SEARCH_WORDS.filter(function(w){ return allowed.indexOf(w.word[0].toUpperCase()) >= 0; });
  sQuiz = shuffleArr(pool).slice(0, Math.min(SEARCH_COUNT, pool.length));
  sIdx = 0; sScore = 0;
  letters = shuffleArr(allowed);
  show('scr-search');
  buildBoard2();
  showSearchQ();
}
function showSearchQ(){
  if(sIdx >= sQuiz.length){ finishSearch(); return; }
  sAnswered = false;
  var q = sQuiz[sIdx];
  var visual = $('search-visual');
  visual.innerHTML = '';
  try{ visual.appendChild(AppUI.cardImg(q.img, q.emoji)); }
  catch(e){ visual.textContent = q.emoji; }
  $('search-word').textContent = q.word + ' starts with ... ?';
  $('s-hud-left').textContent = 'だい' + (sIdx+1) + 'もん / ' + sQuiz.length + 'もん';
  $('s-score').textContent = 'せいかい ' + sScore;
  say(q.word + '! ' + q.word + ' starts with...'); // ← もじさがしの「よみあげ」機能(出題)
}
$('btn-repeat2').addEventListener('click', function(){
  sfx('tap');
  var q = sQuiz[sIdx];
  if(q) say(q.word + '! ' + q.word + ' starts with...');
});
$('board2').addEventListener('click', function(e){
  var el = e.target.closest('.k-tile');
  if(!el || sAnswered) return;
  var q = sQuiz[sIdx];
  if(el.dataset.l === q.word[0].toUpperCase()){
    sAnswered = true; sScore++;
    var rect = el.getBoundingClientRect();
    el.classList.remove('app-anim-shake');
    el.classList.add('app-anim-pop');
    sfx('correct');
    starsAt(rect.left + rect.width/2, rect.top + rect.height/2);
    $('s-score').textContent = 'せいかい ' + sScore;
    setTimeout(function(){ el.classList.remove('app-anim-pop'); sIdx++; showSearchQ(); }, 1100);
  }else{
    el.classList.remove('app-anim-shake'); void el.offsetWidth; el.classList.add('app-anim-shake');
    sfx('wrong');
    setTimeout(function(){ el.classList.remove('app-anim-shake'); }, 460);
  }
});
function finishSearch(){
  var perfect = (sScore === sQuiz.length && sQuiz.length > 0);
  showResult({
    icon: perfect ? '🏆' : '🎉',
    title: sQuiz.length + 'もん中 ' + sScore + 'もん せいかい!',
    stats: []
  });
  celebrate({
    icon: perfect ? '🏆' : '🎉',
    title: perfect ? 'パーフェクト!' : 'よくできました!',
    sub: sQuiz.length + 'もん中 ' + sScore + 'もん せいかい',
    autoHideMs: 1800
  });
}

/* ============================================================
   9. ナビゲーション
   ============================================================ */
$('mode-personal').addEventListener('click', function(){ sfx('tap'); startKaruta('personal'); });
$('mode-board').addEventListener('click', function(){ sfx('tap'); startKaruta('board'); });
$('mode-search').addEventListener('click', function(){ sfx('tap'); startSearch(); });

function goHome(){
  try{ speechSynthesis.cancel(); }catch(e){}
  target = null;
  stopLiveTimer();
  show('scr-mode');
  updateBestBadge();
}
$('btn-home').addEventListener('click', function(){ sfx('tap'); goHome(); });
$('btn-home2').addEventListener('click', function(){ sfx('tap'); goHome(); });
$('btn-again').addEventListener('click', function(){
  sfx('tap');
  if(mode === 'search') startSearch();
  else if(mode === 'personal' || mode === 'board') startKaruta(mode);
});

/* ============================================================
   10. つかいかた
   ============================================================ */

/* ============================================================
   11. 初期化
   ============================================================ */
show('scr-mode');
updateBestBadge();

/* テスト・デバッグ用の状態フック(授業では使いません) */
window.__karutaState = function(){
  var best = null;
  try{ best = bestStore().get(null); }catch(e){}
  return {
    screen: curScreen, mode: mode, range: range,
    remaining: order.length - orderIdx, target: target,
    combo: combo, comboBest: comboBest,
    teamScore: { red: teamScore.red, white: teamScore.white }, turnTeam: turnTeam,
    sIdx: sIdx, sScore: sScore, sQuizLen: sQuiz.length,
    best: best
  };
};
})();
